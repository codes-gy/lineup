server:
  port: ${PORT:8080}

spring:
  application:
    name: wating-system
  data:
    redis:
      # 접속 정보는 환경변수로 넣는다. 값이 없으면 로컬 Redis(localhost:6379)에 붙는다
      # Upstash는 REDIS_SSL=true가 필수
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
