<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineUp · 접속 대기</title>
    <link rel="stylesheet" href="/css/lineup.css">
</head>
<body>
<div class="app">
    <header class="top">
        <span class="brand">LineUp</span>
        <span class="event">콘서트 예매 대기</span>
    </header>

    <!-- 대기 중 -->
    <main id="waiting" class="app" style="min-height: 0; flex-grow: 1">
        <section class="hero">
            <div class="ring">
                <svg width="250" height="250" viewBox="0 0 250 250" role="img" aria-label="입장 진행률" id="ring">
                    <circle class="ring-track" cx="125" cy="125" r="108"></circle>
                    <circle class="ring-bar" id="ring-bar" cx="125" cy="125" r="108"
                            stroke-dasharray="0 679" transform="rotate(-90 125 125)"></circle>
                </svg>
                <div class="ring-center">
                    <span class="ring-label">예상 입장까지</span>
                    <span class="ring-value" id="eta">--:--</span>
                    <span class="ring-label" id="eta-clock">대기표 발급 중</span>
                </div>
            </div>
            <p class="ahead" aria-live="polite">내 앞에 <strong id="rank-num">-</strong> 명</p>
        </section>

        <section class="sheet">
            <div class="sheet-head">
                <h1 class="sheet-title">입장 일정</h1>
                <span class="sheet-note">3초마다 5명 기준</span>
            </div>
            <ol class="timeline">
                <li class="done">
                    <time id="registered-at">--:--</time>
                    <span class="rail"><span class="dot"></span></span>
                    <span class="step"><strong>대기열 등록</strong><span id="ticket-no">대기 번호 -</span></span>
                </li>
                <li class="now">
                    <time>지금</time>
                    <span class="rail"><span class="dot"></span></span>
                    <span class="step"><strong id="progress-text">순번 기다리는 중</strong><span>1초마다 새 순번</span></span>
                </li>
                <li>
                    <time id="entry-at">~--:--</time>
                    <span class="rail"><span class="dot"></span></span>
                    <span class="step"><strong>입장 허용</strong><span>예매 페이지로 자동 이동</span></span>
                </li>
            </ol>
            <button type="button" class="btn" onclick="leave()">대기 취소</button>
        </section>
    </main>

    <!-- 입장 허용 -->
    <main id="allowed" class="state" hidden>
        <div class="badge">✓</div>
        <h1 class="title">내 차례가 되었어요</h1>
        <p class="desc">예매 페이지로 이동합니다.</p>
    </main>

    <!-- 대기 취소 -->
    <main id="cancelled" class="state" hidden>
        <div class="badge">×</div>
        <h1 class="title">대기를 취소했어요</h1>
        <p class="desc">다시 줄을 서면 맨 뒤 순번으로 등록됩니다.</p>
        <button type="button" class="btn primary" style="margin-top: 16px" onclick="location.reload()">다시 줄 서기</button>
    </main>
</div>

<script>
    // 스케줄러(QueueService.allowUsers)가 3초마다 앞에서 5명씩 입장시킨다
    const BATCH_SIZE = 5;
    const BATCH_INTERVAL_SEC = 3;
    const RING_LENGTH = 2 * Math.PI * 108;

    const userId = "user_" + Math.floor(Math.random() * 10000);
    let timer = null;
    let initialRank = null;

    // 1. 진입 시 바로 등록
    fetch(`/api/register?userId=${userId}`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            document.getElementById('registered-at').innerText = formatClock(new Date());
            handle(data);
            // 1초마다 순번 조회 (Polling)
            timer = setInterval(checkStatus, 1000);
        });

    function checkStatus() {
        fetch(`/api/status?userId=${userId}`)
            .then(res => res.json())
            .then(handle);
    }

    function handle(data) {
        if (!data) return;

        if (data.status === 'ALLOWED') {
            clearInterval(timer);
            show('allowed');
            setTimeout(() => {
                window.location.href = `/ticket.html?token=${data.token}`;
            }, 1500);
            return;
        }

        if (data.status === 'NOT_FOUND') {
            clearInterval(timer);
            show('cancelled');
            return;
        }

        const rank = Math.max(0, data.rank ?? 0);
        if (initialRank === null) {
            initialRank = rank;
            document.getElementById('ticket-no').innerText = `대기 번호 ${(rank + 1).toLocaleString('ko-KR')}`;
        }

        const seconds = etaSeconds(rank);
        const entryAt = new Date(Date.now() + seconds * 1000);
        const percent = initialRank === 0 ? 100 : Math.round((1 - rank / initialRank) * 100);

        document.getElementById('rank-num').innerText = rank.toLocaleString('ko-KR');
        document.getElementById('eta').innerText = formatDuration(seconds);
        document.getElementById('eta-clock').innerText =
            `약 ${entryAt.getHours()}시 ${String(entryAt.getMinutes()).padStart(2, '0')}분 입장`;
        document.getElementById('entry-at').innerText = `~${formatClock(entryAt)}`;
        document.getElementById('progress-text').innerText = `순번 기다리는 중 · ${percent}%`;

        const filled = (Math.max(2, percent) / 100) * RING_LENGTH;
        document.getElementById('ring-bar').setAttribute('stroke-dasharray', `${filled} ${RING_LENGTH}`);
        document.getElementById('ring').setAttribute('aria-label', `입장 진행률 ${percent}%`);
    }

    // 내 앞 인원이 몇 번의 입장 주기를 기다려야 하는지로 계산한 대략적인 시간
    function etaSeconds(rank) {
        return (Math.floor(rank / BATCH_SIZE) + 1) * BATCH_INTERVAL_SEC;
    }

    function formatDuration(seconds) {
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    }

    function formatClock(date) {
        return `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    }

    function show(id) {
        for (const section of ['waiting', 'allowed', 'cancelled']) {
            document.getElementById(section).hidden = section !== id;
        }
    }

    function leave() {
        fetch(`/api/leave?userId=${userId}`, { method: 'POST' })
            .then(() => {
                clearInterval(timer);
                show('cancelled');
            });
    }
</script>
</body>
</html>
