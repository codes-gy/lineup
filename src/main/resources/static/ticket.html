<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineUp · 예매 페이지</title>
    <link rel="stylesheet" href="/css/lineup.css">
</head>
<body>
<div class="app">
    <header class="top">
        <span class="brand">LineUp</span>
        <span class="event">콘서트 예매</span>
    </header>

    <section class="hero">
        <div class="ring">
            <svg width="250" height="250" viewBox="0 0 250 250" role="img" aria-label="입장 완료">
                <circle class="ring-track" cx="125" cy="125" r="108"></circle>
                <circle class="ring-bar" cx="125" cy="125" r="108" stroke-dasharray="679 679" transform="rotate(-90 125 125)"></circle>
            </svg>
            <div class="ring-center">
                <span class="ring-label">대기열 통과</span>
                <span class="ring-value" style="font-family: inherit; font-size: 40px; font-weight: 900">입장 완료</span>
            </div>
        </div>
        <p class="ahead">남은 예매 시간 <strong id="remaining">5:00</strong></p>
    </section>

    <section class="sheet">
        <h1 class="sheet-title">예매 페이지에 들어왔어요</h1>
        <p class="desc" style="font-size: 14px">차례가 되어 입장했어요. 시간 안에 좌석을 골라 예매를 마쳐 주세요.<br>시간이 지나면 다시 줄을 서야 합니다.</p>
        <a href="/index.html" class="btn">대기열로 돌아가기</a>
    </section>
</div>

<script>
    // 서버는 입장 토큰을 5분 TTL로 저장한다. 화면은 페이지를 연 시점부터 센 대략적인 남은 시간이다
    const TOKEN_TTL_SEC = 5 * 60;
    const openedAt = Date.now();

    function tick() {
        const left = Math.max(0, TOKEN_TTL_SEC - Math.floor((Date.now() - openedAt) / 1000));
        const min = Math.floor(left / 60);
        const sec = String(left % 60).padStart(2, '0');
        document.getElementById('remaining').innerText = `${min}:${sec}`;
    }

    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
