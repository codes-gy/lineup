<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineUp · 입장 완료</title>
    <link rel="stylesheet" href="/css/lineup.css">
</head>
<body>
<div class="app">
    <header class="top">
        <span class="brand">LineUp</span>
        <span class="event">콘서트 예매</span>
    </header>

    <main class="complete">
        <section class="done-head">
            <svg width="76" height="76" viewBox="0 0 76 76" aria-hidden="true">
                <circle cx="38" cy="38" r="32" fill="#ffffff" stroke="currentColor" stroke-width="8"></circle>
                <path d="M26 39 L34 47 L50 30" fill="none" stroke="currentColor" stroke-width="6"
                      stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            <div>
                <h1 class="title">입장 완료</h1>
                <p class="done-meta" id="done-meta">대기열을 통과했어요</p>
            </div>
        </section>

        <h2 class="sheet-title">이제 이렇게 예매해요</h2>
        <ol class="next-steps">
            <li class="current">
                <span class="step-no">1</span>
                <span><strong>좌석 고르기</strong><span>원하는 구역과 좌석을 선택해요</span></span>
            </li>
            <li>
                <span class="step-no">2</span>
                <span><strong>결제하기</strong><span>선택한 좌석을 결제해요</span></span>
            </li>
            <li>
                <span class="step-no">3</span>
                <span><strong>예매 확인</strong><span>예매 내역을 확인해요</span></span>
            </li>
        </ol>

        <p class="done-note">LineUp은 여기까지 대기열을 맡아요. 좌석 · 결제는 연결된 예매 서비스가 이어서 처리해요.</p>

        <button type="button" class="btn primary done-cta" onclick="showDemoNote()">좌석 고르러 가기</button>
        <p class="done-note" id="demo-note" hidden>이 데모는 대기열과 입장 검증까지만 구현돼 있어요.</p>
    </main>
</div>

<script>
    // 대기 화면이 저장한 대기 번호와, 이 페이지를 연 시각(= 입장 시각)
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    let ticketNo = null;
    try {
        ticketNo = sessionStorage.getItem('lineup.ticketNo');
    } catch (e) {
        // 저장소를 못 쓰면 번호 없이 입장 시각만 보여 준다
    }
    document.getElementById('done-meta').innerText = ticketNo
        ? `${time} 입장 · 대기 번호 ${Number(ticketNo).toLocaleString('ko-KR')}`
        : `${time} 입장`;

    function showDemoNote() {
        document.getElementById('demo-note').hidden = false;
    }
</script>
</body>
</html>
