<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LineUp · 예매 페이지</title>
    <link rel="stylesheet" href="/css/lineup.css">
</head>
<body>
<div class="brand"><span class="brand-mark">L</span>LineUp</div>

<main class="card">
    <div class="icon success">✓</div>
    <span class="pill success">입장 완료</span>
    <h1 class="title" style="margin-top:14px;">예매 페이지에 들어왔어요</h1>
    <p class="desc">입장 토큰이 확인되어 대기열을 통과했어요.</p>

    <dl class="meta">
        <div>
            <dt>토큰 남은 시간</dt>
            <dd id="remaining">5:00</dd>
        </div>
        <div>
            <dt>입장 토큰</dt>
            <dd id="token">-</dd>
        </div>
    </dl>

    <p class="notice">토큰은 발급 후 5분 동안만 유효해요.<br>시간이 지나면 다시 줄을 서야 합니다.</p>
</main>

<p class="footnote">ValidationFilter가 Redis의 token:{UUID} 키로 진입을 확인했어요</p>

<script>
    // 서버는 토큰을 5분 TTL로 저장한다. 화면은 페이지를 연 시점부터 센 대략적인 남은 시간이다
    const TOKEN_TTL_SEC = 5 * 60;
    const openedAt = Date.now();

    const token = new URLSearchParams(location.search).get('token') ?? '';
    document.getElementById('token').innerText = token ? `${token.slice(0, 8)}…` : '-';

    function tick() {
        const left = Math.max(0, TOKEN_TTL_SEC - Math.floor((Date.now() - openedAt) / 1000));
        const min = Math.floor(left / 60);
        const sec = String(left % 60).padStart(2, '0');
        document.getElementById('remaining').innerText = `${min}:${sec}`;
    }

    tick();
    setInterval(tick, 1000);
</script>
</body>
</html>
